[project]
name = "major-decision-assistant"
version = "0.1.0"
description = "A deep-research agent (Lead, parallel Researchers, Writer) that checks whether college majors deliver the earnings and jobs students expect, using ACS, College Scorecard, FRED, BLS and NSF graduate-survey (NSCG) data"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.23",
    "google-cloud-aiplatform>=1.40.0",
    "duckdb>=1.1",
]

[dependency-groups]
# Only needed to rebuild data/majors.duckdb offline: uv run --group build build_data.py
build = ["pandas>=2.0", "openpyxl>=3.1"]
